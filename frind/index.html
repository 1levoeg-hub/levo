<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e8">
<title>المهمة · THE QUEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   المهمة — ستايل كرتوني
   ============================================================ */
:root{
  --ink:#2b2140;
  --ink-soft:#5b4a7a;
  --cream:#fff6ea;
  --pink:#ff8fc7;
  --pink-deep:#ff5fa2;
  --teal:#5ed6c9;
  --teal-deep:#1fb8a8;
  --yellow:#ffd84d;
  --yellow-deep:#ffb703;
  --purple:#b28dff;
  --purple-deep:#7b53e0;
  --blue:#7cc7ff;
  --green:#7ee787;
  --green-deep:#2eaf5b;
  --red:#ff6b6b;
  --line:5px solid var(--ink);
  --shadow:8px 8px 0 var(--ink);
  --shadow-sm:5px 5px 0 var(--ink);
  --shadow-lg:12px 12px 0 var(--ink);
  --radius:28px;
  --radius-sm:20px;
  --bounce:cubic-bezier(.34,1.56,.64,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;
  font-weight:500;
  background:#fff0f6;
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.6;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 10% 10%, #ffe0f0 0%, transparent 45%),
    radial-gradient(circle at 90% 15%, #d8f4ff 0%, transparent 45%),
    radial-gradient(circle at 20% 90%, #fff3c9 0%, transparent 50%),
    radial-gradient(circle at 85% 85%, #e5dcff 0%, transparent 50%),
    linear-gradient(180deg,#fff0f6 0%,#fce7ff 45%,#e8f4ff 100%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle, rgba(43,33,64,.12) 1.6px, transparent 1.7px);
  background-size:26px 26px;
}
canvas#fx{position:fixed;inset:0;z-index:0;pointer-events:none}

h1,h2,h3{margin:0;font-family:'Lalezar',cursive;font-weight:400;letter-spacing:0;line-height:1.2}

/* ---------- HUD ---------- */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;gap:12px;
  padding:10px clamp(10px,2.5vw,22px);
  background:rgba(255,246,234,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:5px solid var(--ink);
  transition:transform .5s var(--bounce), opacity .4s ease;
  flex-wrap:nowrap;
}
.hud.hidden{transform:translateY(-130%);opacity:0;pointer-events:none}
.hud-left{display:flex;flex-direction:column;gap:0;min-width:0;flex:0 0 auto}
.hud-logo{
  font-family:'Lalezar',cursive;font-size:18px;line-height:1.1;
  color:var(--pink-deep);
  text-shadow:2px 2px 0 var(--ink);
}
.hud-status{font-size:11px;font-weight:600;color:var(--ink-soft);white-space:nowrap}

.pips{display:flex;align-items:center;gap:6px;flex:1 1 auto;justify-content:center;min-width:0}
.pip{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:999px;
  border:3px solid var(--ink);
  background:#fff;
  font-family:'Lalezar',cursive;font-size:13px;
  color:var(--ink-soft);
  box-shadow:3px 3px 0 var(--ink);
  transition:.3s var(--bounce);
  flex-shrink:0;
}
.pip .pip-dot{font-size:12px;line-height:1}
.pip.active{
  background:var(--yellow);
  color:var(--ink);
  transform:translateY(-2px) rotate(-3deg);
  animation:pipBounce 1.4s ease-in-out infinite;
}
.pip.done{background:var(--teal);color:var(--ink)}
@keyframes pipBounce{0%,100%{transform:translateY(-2px) rotate(-3deg)}50%{transform:translateY(-5px) rotate(2deg)}}

/* ---------- SCORE ---------- */
.score{
  display:flex;align-items:center;gap:6px;
  flex:0 0 auto;
}
.score-badge{
  display:flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;
  border:3px solid var(--ink);
  background:#fff;
  font-family:'Lalezar',cursive;font-size:14px;
  color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  min-width:52px;justify-content:center;
  transition:.2s var(--bounce);
}
.score-badge .s-icon{font-size:14px;line-height:1}
.score-badge .s-num{font-size:15px;line-height:1}
.score-badge.correct{background:var(--green)}
.score-badge.wrong{background:#ffd5d5}
.score-badge.pulse{animation:scorePulse .5s var(--bounce)}
@keyframes scorePulse{0%{transform:scale(1)}50%{transform:scale(1.28) rotate(-6deg)}100%{transform:scale(1)}}

.hud-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:#fff;
  border:3px solid var(--ink);
  color:var(--ink);
  font-size:16px;cursor:pointer;
  box-shadow:3px 3px 0 var(--ink);
  transition:.2s var(--bounce);
  font-family:'Lalezar',cursive;
}
.icon-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:var(--yellow)}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.icon-btn.on{background:var(--pink);color:#fff}

.progress-track{
  position:fixed;top:0;left:0;height:8px;z-index:51;width:0%;
  background:repeating-linear-gradient(90deg,var(--pink-deep) 0 20px, var(--yellow) 20px 40px, var(--teal) 40px 60px);
  border-bottom:3px solid var(--ink);
  transition:width .9s var(--bounce);
}

/* ---------- stage ---------- */
#stage{
  position:relative;z-index:1;
  min-height:100vh;
  padding:120px clamp(16px,4vw,40px) 90px;
  transition:opacity .3s ease, transform .3s ease;
}
#stage.stage-out{opacity:0;transform:translateY(16px) scale(.98)}
#stage.stage-in{animation:stageIn .7s var(--bounce) both}
@keyframes stageIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{
  font-family:'Lalezar',cursive;font-size:20px;
  padding:16px 34px;border-radius:999px;cursor:pointer;
  border:4px solid var(--ink);
  background:#fff;
  color:var(--ink);
  box-shadow:5px 5px 0 var(--ink);
  transition:.18s var(--bounce);
  min-height:56px;
}
.btn:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.primary{background:var(--yellow)}
.btn.primary:hover{background:#ffe066}
.btn.pink{background:var(--pink);color:#fff}
.btn.teal{background:var(--teal)}
.btn.xl{padding:22px 56px;font-size:26px;min-height:72px}
.btn.ghost{
  background:transparent;box-shadow:none;border-color:transparent;
  font-size:15px;color:var(--ink-soft);padding:10px 18px;min-height:auto;
}
.btn.ghost:hover{background:#fff;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);transform:translate(-2px,-2px)}

.glass{
  background:#fff;
  border:var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* ============================================================
   INTRO
   ============================================================ */
.intro{
  min-height:calc(100vh - 240px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;padding:20px;
}
.intro-tag{
  display:inline-block;
  font-family:'Lalezar',cursive;font-size:16px;
  background:var(--pink);color:#fff;
  padding:8px 22px;border-radius:999px;
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  margin-bottom:30px;
  transform:rotate(-4deg);
  animation:wiggle 3s ease-in-out infinite;
}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(2deg) translateY(-3px)}}

.intro-title{
  font-family:'Lalezar',cursive;font-weight:400;
  font-size:clamp(56px,15vw,150px);
  line-height:.95;
  color:var(--pink-deep);
  text-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--yellow),12px 12px 0 rgba(43,33,64,.15);
  margin-bottom:24px;
  animation:titlePop .9s var(--bounce) both;
}
@keyframes titlePop{0%{transform:scale(.4) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

.intro-line{
  font-size:clamp(18px,3vw,26px);color:var(--ink-soft);
  margin:6px 0;font-weight:600;
  animation:fadeUp .8s var(--bounce) .5s both;
}
.intro-line.big{
  font-size:clamp(24px,4.5vw,40px);color:var(--ink);font-family:'Lalezar',cursive;
  margin-top:10px;
  animation:fadeUp .8s var(--bounce) .7s both;
}
.intro-line.big .hl{
  color:var(--pink-deep);
  text-shadow:3px 3px 0 var(--yellow);
  padding:0 6px;
}
.intro-actions{
  margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:16px;
  animation:fadeUp .9s var(--bounce) 1s both;
}
.intro-foot{
  margin-top:50px;font-family:'Lalezar',cursive;font-size:14px;color:var(--ink-soft);
  animation:fadeUp .9s var(--bounce) 1.2s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.blob{position:absolute;border:4px solid var(--ink);pointer-events:none;z-index:-1}
.blob.b1{width:90px;height:90px;border-radius:50%;background:var(--yellow);top:12%;right:8%;animation:float1 6s ease-in-out infinite}
.blob.b2{width:60px;height:60px;background:var(--teal);top:70%;left:10%;transform:rotate(20deg);border-radius:16px;animation:float2 7s ease-in-out infinite}
.blob.b3{width:70px;height:70px;border-radius:50%;background:var(--pink);bottom:10%;right:14%;animation:float1 5s ease-in-out infinite reverse}
.blob.b4{width:50px;height:50px;background:var(--purple);top:22%;left:8%;border-radius:14px;transform:rotate(-15deg);animation:float2 8s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(8deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(20deg)}50%{transform:translateY(-25px) rotate(-8deg)}}

/* ============================================================
   MISSION LAYOUT
   ============================================================ */
.mission{max-width:1080px;margin:0 auto}
.m-head{text-align:center;margin-bottom:clamp(28px,5vw,50px)}
.m-code{
  display:inline-block;font-family:'Lalezar',cursive;font-size:20px;
  color:#fff;background:var(--purple);
  padding:8px 24px;border-radius:999px;
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  margin-bottom:20px;
  transform:rotate(-3deg);
}
.m-title{
  font-family:'Lalezar',cursive;font-size:clamp(34px,6vw,60px);
  color:var(--ink);line-height:1.15;
}
.m-title .hl{
  color:var(--pink-deep);
  text-shadow:3px 3px 0 var(--yellow);
  padding:0 6px;
}
.m-prompt{
  margin:16px auto 0;max-width:640px;
  color:var(--ink-soft);font-size:clamp(15px,1.8vw,18px);
  font-weight:600;line-height:1.7;
}

/* ---------- choice cards ---------- */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.5vw,26px)}
.card{
  position:relative;cursor:pointer;text-align:right;
  border-radius:var(--radius);overflow:hidden;padding:0;
  border:4px solid var(--ink);
  background:#fff;
  color:inherit;font-family:inherit;
  box-shadow:6px 6px 0 var(--ink);
  transition:.25s var(--bounce);
}
.card .card-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:#f0e6ff;border-bottom:4px solid var(--ink)}
.card .card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s var(--bounce)}
.card .card-label{
  padding:14px 18px;
  font-family:'Lalezar',cursive;font-size:20px;color:var(--ink);
  display:flex;flex-direction:column;gap:2px;
}
.card .card-sub{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:12px;font-weight:600;color:var(--ink-soft)}
.card:hover{transform:translate(-4px,-4px) rotate(-1deg);box-shadow:10px 10px 0 var(--ink)}
.card:hover .card-img img{transform:scale(1.1)}
.card.selected{border-color:var(--ink)}
.card.correct{background:var(--green);animation:correctPop .6s var(--bounce)}
.card.wrong{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
.card.wrong::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:rgba(255,107,107,.35)}
@keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.06) rotate(2deg)}100%{transform:scale(1)}}
@keyframes shake{10%,90%{transform:translateX(-4px) rotate(-2deg)}20%,80%{transform:translateX(6px) rotate(2deg)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}

/* ---------- quote / options ---------- */
.quote-box{
  padding:clamp(30px,5vw,50px);border-radius:var(--radius);margin-bottom:30px;
  position:relative;text-align:center;
  background:var(--purple);
  border:4px solid var(--ink);
  box-shadow:8px 8px 0 var(--ink);
  transform:rotate(-1deg);
}
.quote-box .qmark{
  font-family:'Lalezar',cursive;font-size:70px;line-height:1;color:var(--yellow);
  display:block;
  text-shadow:3px 3px 0 var(--ink);
  transform:rotate(-8deg);
}
.quote-box blockquote{
  margin:0;font-size:clamp(20px,3.4vw,32px);line-height:1.5;
  font-family:'Lalezar',cursive;color:#fff;font-weight:400;
}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.option{
  display:flex;align-items:center;gap:14px;text-align:right;
  padding:18px 22px;border-radius:var(--radius-sm);cursor:pointer;min-height:68px;
  border:4px solid var(--ink);background:#fff;
  color:var(--ink);font-family:'Baloo Bhaijaan 2',sans-serif;
  font-size:17px;font-weight:600;
  box-shadow:5px 5px 0 var(--ink);
  transition:.2s var(--bounce);
}
.option .opt-key{
  flex:none;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  font-family:'Lalezar',cursive;font-size:18px;
  border:3px solid var(--ink);background:var(--yellow);color:var(--ink);
}
.option:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink);background:#fffbe9}
.option.correct{background:var(--green);animation:correctPop .5s var(--bounce)}
.option.correct .opt-key{background:#fff}
.option.wrong{animation:shake .5s cubic-bezier(.36,.07,.19,.97);background:#ffdede}

/* ---------- keypad ---------- */
.code-wrap{
  max-width:440px;margin:0 auto;padding:clamp(26px,4vw,40px);
  display:flex;flex-direction:column;align-items:center;gap:26px;
  background:#fff;
}
.code-display{display:flex;gap:14px;direction:ltr}
.digit{
  width:60px;height:76px;border-radius:18px;
  display:grid;place-items:center;
  font-family:'Lalezar',cursive;font-size:36px;
  border:4px solid var(--ink);background:#f6f0ff;
  color:var(--ink);transition:.2s var(--bounce);
  box-shadow:3px 3px 0 var(--ink);
}
.digit.filled{background:var(--yellow);transform:translateY(-3px)}
.code-wrap.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
.code-wrap.granted .digit{background:var(--green);color:var(--ink)}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:300px}
.key{
  height:64px;border-radius:18px;cursor:pointer;
  font-family:'Lalezar',cursive;font-size:24px;
  border:4px solid var(--ink);background:#fff;color:var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  transition:.15s var(--bounce);
}
.key:hover{background:var(--yellow);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.key.blank{visibility:hidden;pointer-events:none}
.code-hint{
  margin:0;font-size:14px;color:var(--ink-soft);text-align:center;line-height:1.7;
  border-top:3px dashed var(--ink-soft);padding-top:18px;width:100%;font-weight:600;
}
.code-hint b{color:var(--pink-deep);font-weight:700}

/* ---------- assemble ---------- */
.assemble{display:flex;flex-direction:column;align-items:center;gap:36px}
.slots{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.slot{
  width:clamp(64px,16vw,86px);height:clamp(80px,20vw,106px);
  border-radius:22px;display:grid;place-items:center;cursor:pointer;
  font-family:'Lalezar',cursive;font-size:clamp(30px,8vw,44px);
  border:4px dashed var(--ink-soft);background:#fff;
  color:var(--ink);transition:.3s var(--bounce);
}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--yellow);box-shadow:4px 4px 0 var(--ink);animation:slotPop .35s var(--bounce)}
@keyframes slotPop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tile{
  width:clamp(64px,16vw,86px);height:clamp(80px,20vw,106px);
  border-radius:22px;cursor:pointer;
  font-family:'Lalezar',cursive;font-size:clamp(30px,8vw,44px);
  border:4px solid var(--ink);
  background:var(--pink);color:#fff;
  box-shadow:5px 5px 0 var(--ink);
  transition:.2s var(--bounce);
}
.tile:hover{transform:translate(-3px,-3px) rotate(-3deg);box-shadow:8px 8px 0 var(--ink)}
.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tile.used{opacity:.2;pointer-events:none;transform:scale(.9)}
.assemble.solved .slot{background:var(--green);box-shadow:4px 4px 0 var(--ink)}

/* ============================================================
   REVEAL / MEMORY
   ============================================================ */
.reveal{max-width:820px;margin:0 auto;text-align:center;animation:fadeUp .7s var(--bounce) both}
.reveal-tag{
  display:inline-block;
  font-family:'Lalezar',cursive;font-size:clamp(28px,5.5vw,52px);
  color:#fff;background:var(--teal);
  padding:12px 34px;border-radius:999px;
  border:5px solid var(--ink);box-shadow:7px 7px 0 var(--ink);
  transform:rotate(-3deg);
  animation:tagIn .8s var(--bounce) both;
}
.reveal-tag.denied{background:var(--red)}
@keyframes tagIn{0%{opacity:0;transform:scale(.5) rotate(-15deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.reveal-sub{margin-top:18px;font-family:'Lalezar',cursive;font-size:18px;color:var(--ink-soft);letter-spacing:.06em;animation:fadeUp .7s var(--bounce) .2s both}

.memory{margin-top:32px;padding:clamp(16px,2.5vw,26px);text-align:right;overflow:hidden;background:#fff;animation:fadeUp .8s var(--bounce) .3s both}
.memory-img{border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:#f0e6ff;border:4px solid var(--ink);position:relative}
.memory-img img{width:100%;height:100%;object-fit:cover;display:block;animation:imgReveal 1.1s var(--bounce) both}
@keyframes imgReveal{0%{transform:scale(1.25) rotate(3deg);filter:blur(10px);opacity:0}60%{filter:blur(0);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.memory-body{padding:24px 6px 6px}
.memory-eyebrow{
  display:inline-block;font-family:'Lalezar',cursive;font-size:15px;
  background:var(--yellow);color:var(--ink);
  padding:5px 16px;border-radius:999px;border:3px solid var(--ink);
  margin-bottom:14px;transform:rotate(-2deg);
}
.memory-title{font-family:'Lalezar',cursive;font-size:clamp(26px,4vw,38px);color:var(--pink-deep);margin-bottom:12px}
.memory-text{color:var(--ink-soft);line-height:1.9;font-size:clamp(15px,1.8vw,17px);max-width:65ch;font-weight:500}
.memory-details{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
  margin-top:22px;max-width:720px;
}
.memory-detail{
  padding:14px 16px;border:3px solid var(--ink);border-radius:18px;
  background:#fff9e9;box-shadow:3px 3px 0 var(--ink);
}
.memory-detail strong{display:block;font-family:'Lalezar',cursive;font-size:16px;color:var(--purple-deep)}
.memory-detail span{display:block;margin-top:4px;color:var(--ink-soft);font-size:14px;line-height:1.7}
.memory-cap{margin-top:18px;display:inline-block;font-family:'Lalezar',cursive;font-size:13px;color:#fff;background:var(--purple);padding:6px 16px;border-radius:999px;border:3px solid var(--ink)}

.fragment{
  margin-top:24px;display:inline-flex;align-items:center;gap:14px;
  padding:12px 22px;border-radius:999px;
  border:4px solid var(--ink);background:var(--yellow);
  font-family:'Lalezar',cursive;font-size:16px;color:var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  animation:fragIn .8s var(--bounce) .8s both;
}
.fragment .frag-letter{font-size:28px;color:var(--pink-deep);text-shadow:2px 2px 0 #fff}
@keyframes fragIn{0%{opacity:0;transform:translateY(16px) scale(.8) rotate(-8deg)}100%{opacity:1;transform:none}}

.reveal-actions{margin-top:36px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;animation:fadeUp .7s var(--bounce) 1s both}

/* ============================================================
   FINALE
   ============================================================ */
.finale{max-width:1080px;margin:0 auto;text-align:center}
.finale-title{
  font-family:'Lalezar',cursive;font-weight:400;
  font-size:clamp(46px,12vw,120px);line-height:1;
  color:var(--teal-deep);
  text-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--yellow),12px 12px 0 rgba(43,33,64,.12);
  animation:tagIn 1s var(--bounce) both;
}
.reward-badge{
  display:inline-block;margin-top:28px;padding:14px 34px;border-radius:999px;
  font-family:'Lalezar',cursive;font-size:clamp(18px,3.5vw,26px);
  color:#fff;background:var(--pink-deep);
  border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
  transform:rotate(-3deg);
  animation:badgeIn .8s var(--bounce) 1.4s both;
}
@keyframes badgeIn{0%{opacity:0;transform:scale(.4) rotate(-20deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}

.score-summary{
  margin-top:38px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
  animation:fadeUp .8s var(--bounce) 1.8s both;
}
.score-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 24px;border-radius:999px;
  border:4px solid var(--ink);background:#fff;
  box-shadow:5px 5px 0 var(--ink);
  font-family:'Lalezar',cursive;font-size:18px;
}
.score-row .sr-icon{
  width:34px;height:34px;border-radius:50%;

  border:3px solid var(--ink);
}
.score-row.good .sr-icon{background:var(--green)}
.score-row.bad .sr-icon{background:#ffd5d5}
.score-row b{font-size:22px;color:var(--pink-deep);text-shadow:1.5px 1.5px 0 var(--yellow)}

.reward{margin-top:clamp(50px,8vw,80px);display:flex;flex-direction:column;gap:clamp(40px,6vw,64px)}
.reveal-scroll{opacity:0;transform:translateY(40px);transition:opacity .9s var(--bounce), transform .9s var(--bounce)}
.reveal-scroll.in{opacity:1;transform:none}

.letter{
  padding:clamp(28px,5vw,56px);text-align:right;
  background:linear-gradient(160deg,#fff8ee,#ffe8f4);
  position:relative;
}
.letter::before{
  content:'✉';position:absolute;top:-28px;left:36px;
  width:56px;height:56px;border-radius:50%;
  background:var(--yellow);border:4px solid var(--ink);
  display:grid;place-items:center;font-size:28px;
  box-shadow:4px 4px 0 var(--ink);transform:rotate(-8deg);
}
.letter h2{font-family:'Lalezar',cursive;font-size:clamp(30px,4.5vw,46px);margin-bottom:26px;line-height:1.2;color:var(--ink)}
.letter h2 em{font-style:normal;color:var(--pink-deep);text-shadow:2px 2px 0 var(--yellow)}
.letter p{color:var(--ink-soft);line-height:2;font-size:clamp(15.5px,1.9vw,18px);margin:0 0 20px;font-weight:500}
.letter p:last-child{margin-bottom:0}
.letter p b{color:var(--pink-deep);font-weight:700}
.letter .sign{margin-top:34px;font-family:'Lalezar',cursive;font-size:22px;color:var(--purple-deep);text-align:left}

.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.gallery figure{
  margin:0;position:relative;border-radius:24px;overflow:hidden;
  aspect-ratio:1/1;border:4px solid var(--ink);background:#f0e6ff;
  box-shadow:6px 6px 0 var(--ink);
  transition:.35s var(--bounce);cursor:pointer;
}
.gallery figure:nth-child(3n+1){aspect-ratio:4/5}
.gallery figure:nth-child(2){transform:rotate(1.5deg)}
.gallery figure:nth-child(4){transform:rotate(-1.5deg)}
.gallery figure:nth-child(6){transform:rotate(1deg)}
.gallery img{width:100%;height:100%;object-fit:cover;transition:.6s var(--bounce)}
.gallery figure:hover{transform:translate(-4px,-4px) rotate(0deg);box-shadow:10px 10px 0 var(--ink)}
.gallery figure:hover img{transform:scale(1.08)}
.gallery figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:36px 16px 14px;
  font-family:'Lalezar',cursive;font-size:16px;color:#fff;text-align:right;
  background:linear-gradient(180deg,transparent,rgba(43,33,64,.9));
}

.video-wrap{border-radius:var(--radius);overflow:hidden;border:var(--line);box-shadow:var(--shadow);background:#000}
.video-wrap video{width:100%;display:block;max-height:70vh}

.surprise{
  padding:clamp(36px,6vw,64px);border-radius:var(--radius);text-align:center;
  background:linear-gradient(160deg,#fff3c9,#ffe0f0);
  border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
  position:relative;overflow:hidden;
}
.surprise::before,.surprise::after{
  content:'★';position:absolute;font-size:34px;color:var(--yellow);
  text-shadow:2px 2px 0 var(--ink);
}
.surprise::before{top:14px;right:22px;transform:rotate(-15deg)}
.surprise::after{bottom:14px;left:22px;transform:rotate(20deg)}
.surprise-text{
  margin-top:30px;font-family:'Lalezar',cursive;
  font-size:clamp(20px,3vw,30px);line-height:1.8;color:var(--ink);
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height 1s var(--bounce), opacity .8s var(--bounce), margin .6s;
}
.surprise-text.show{max-height:600px;opacity:1}
.surprise-text b{color:var(--pink-deep);text-shadow:2px 2px 0 var(--yellow)}

#toast-wrap{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:10px;align-items:center;
  pointer-events:none;width:calc(100% - 32px);max-width:520px;
}
.toast{
  width:100%;padding:16px 22px;border-radius:20px;text-align:center;
  background:#fff;border:4px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);

}
.toast.out{animation:toastOut .35s ease forwards}
.toast .t-title{font-family:'Lalezar',cursive;font-size:20px;color:var(--red)}
.toast .t-sub{margin-top:6px;font-size:14px;color:var(--ink-soft);font-weight:600}
.toast.bad .t-title{color:var(--red)}
.toast.good .t-title{color:var(--teal-deep)}
@keyframes toastIn{from{opacity:0;transform:translateY(28px) scale(.9) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(16px) scale(.94)}}

#flash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;background:#fff}
#flash.fire{animation:flashAnim .9s ease-out}
@keyframes flashAnim{0%{opacity:.85}100%{opacity:0}}

.cine{
  position:fixed;inset:0;z-index:75;display:grid;place-items:center;
  background:linear-gradient(160deg,#ffd6e8,#e0d6ff,#d0f0ff);
  animation:fadeIn .5s ease both;
}
.cine.hide{animation:fadeOut .6s ease forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.cine-inner{text-align:center;padding:20px}
.cine-line1{
  font-family:'Lalezar',cursive;font-weight:400;
  font-size:clamp(38px,9vw,84px);line-height:1.1;
  color:var(--pink-deep);
  text-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--yellow);
  animation:tagIn .9s var(--bounce) both;
}
.cine-line2{margin-top:26px;font-family:'Lalezar',cursive;font-size:clamp(18px,3vw,24px);color:var(--ink-soft);animation:fadeUp .8s var(--bounce) .6s both}
.cine-bar{
  margin:34px auto 0;width:min(340px,72vw);height:16px;border-radius:999px;overflow:hidden;
  background:#fff;border:4px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  animation:fadeUp .8s var(--bounce) .8s both;
}
.cine-bar span{
  display:block;height:100%;width:0;
  background:repeating-linear-gradient(90deg,var(--pink-deep) 0 16px,var(--yellow) 16px 32px,var(--teal) 32px 48px);
  animation:loadBar 2.4s var(--bounce) .9s forwards;
}
@keyframes loadBar{to{width:100%}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1000px){
  .pip .pip-label{display:none}
}
@media (max-width:900px){
  .cards{grid-template-columns:1fr;max-width:440px;margin:0 auto}
  .card .card-img{aspect-ratio:16/10}
  .options{grid-template-columns:1fr}
  .hud-logo{font-size:16px}
}
@media (max-width:640px){
  #stage{padding:110px 16px 70px}
  .hud{padding:8px 10px;gap:8px}
  .hud-logo{font-size:14px}
  .hud-status{display:none}
  .hud-left{display:none}
  .pips{order:-1}
  .pip{padding:4px 8px;font-size:11px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
  .pip .pip-dot{font-size:11px}
  .score-badge{padding:4px 9px;font-size:12px;min-width:44px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
  .score-badge .s-icon{font-size:12px}
  .score-badge .s-num{font-size:13px}
  .icon-btn{width:34px;height:34px;border-radius:10px;font-size:14px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
  .digit{width:50px;height:64px;font-size:30px;border-radius:14px}
  .key{height:56px;font-size:20px}
  .btn{padding:14px 26px;font-size:17px}
  .btn.xl{padding:18px 38px;font-size:22px}
  .gallery{grid-template-columns:repeat(2,1fr);gap:12px}
  .gallery figure{aspect-ratio:1/1!important;transform:none!important}
  .gallery figcaption{font-size:13px;padding:22px 10px 10px}
  .memory-text{font-size:15px}
  .memory-details{grid-template-columns:1fr}
  .letter::before{width:46px;height:46px;font-size:22px;top:-22px;left:22px}
  .quote-box .qmark{font-size:52px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

/* ----------------------------------------------------------------
   3. STATE  (with score)
   ---------------------------------------------------------------- */
const STORAGE_KEY = 'the-quest-ar-v2';

let state = {
  stage: 'intro',
  completed: [],
  score: { correct: 0, wrong: 0 },
  sound: true,
  music: false
};

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (raw && Array.isArray(raw.completed)) {
      state.stage = raw.stage || 'intro';
      state.completed = raw.completed.filter(i => Number.isInteger(i) && i >= 0 && i < MISSIONS.length);
      if (raw.score && typeof raw.score === 'object') {
        state.score = {
          correct: Number(raw.score.correct) || 0,
          wrong: Number(raw.score.wrong) || 0
        };
      }
      state.sound = raw.sound !== false;
    }
  } catch (e) {}
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      stage: state.stage,
      completed: state.completed,
      score: state.score,
      sound: state.sound
    }));
  } catch (e) {}
}
function resetQuest() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state.stage = 'intro';
  state.completed = [];
  state.score = { correct: 0, wrong: 0 };
  Music.stop();
  location.reload();
}

/* ----------------------------------------------------------------
   4. AUDIO
   ---------------------------------------------------------------- */
let AC = null;
function audioCtx() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

const Sound = (() => {
  function blip(freq, dur, type = 'sine', vol = 0.12, when = 0, slideTo = null) {
    if (!state.sound) return;
    const c = audioCtx(); if (!c) return;
    const t = c.currentTime + when;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  return {
    click()   { blip(660, 0.07, 'triangle', 0.08); blip(990, 0.05, 'sine', 0.05, 0.02); },
    hover()   { blip(1100, 0.04, 'sine', 0.025); },
    correct() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => blip(f, 0.4, 'triangle', 0.12, i * 0.085)); },
    wrong()   { blip(220, 0.26, 'sawtooth', 0.07, 0, 110); blip(160, 0.3, 'square', 0.05, 0.07, 90); },
    unlock()  { [392, 523.25, 659.25, 880, 1174.66].forEach((f, i) => blip(f, 0.55, 'triangle', 0.1, i * 0.07)); },
    reward()  { [261.63, 329.63, 392, 523.25, 659.25, 783.99].forEach((f, i) => blip(f, 1.8, 'sine', 0.09, i * 0.13)); },
    tick()    { blip(1400, 0.03, 'square', 0.035); }
  };
})();

const Music = (() => {
  let el = null, nodes = null, active = false;
  function startPad() {
    const c = audioCtx(); if (!c) return;
    const master = c.createGain(); master.gain.value = 0.0001; master.connect(c.destination);
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 900; filter.Q.value = 2.5; filter.connect(master);
    const delay = c.createDelay(1.2); delay.delayTime.value = 0.5;
    const fb = c.createGain(); fb.gain.value = 0.28;
    const wet = c.createGain(); wet.gain.value = 0.28;
    filter.connect(delay); delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(master);
    const freqs = [130.81, 196, 261.63, 329.63];
    const oscs = freqs.map((f, i) => {
      const o = c.createOscillator();
      o.type = i % 2 ? 'sine' : 'triangle';
      o.frequency.value = f;
      o.detune.value = (i - 1.5) * 5;
      const g = c.createGain();
      g.gain.value = 0.08 / (i * 0.6 + 1);
      o.connect(g).connect(filter);
      o.start();
      return o;
    });
    const lfo = c.createOscillator(); lfo.frequency.value = 0.05;
    const lfoGain = c.createGain(); lfoGain.gain.value = 380;
    lfo.connect(lfoGain).connect(filter.frequency); lfo.start();
    master.gain.linearRampToValueAtTime(0.5, c.currentTime + 5);
    nodes = { master, oscs, lfo };
  }
  return {
    start() {
      if (active) return;
      active = true;
      if (CONFIG.music.src) {
        if (!el) { el = new Audio(CONFIG.music.src); el.loop = true; el.volume = 0; }
        el.play().then(() => {
          const target = CONFIG.music.volume; let v = 0;
          const fade = setInterval(() => {
            v += target / 40;
            if (v >= target) { v = target; clearInterval(fade); }
            el.volume = v;
          }, 60);
        }).catch(() => {});
      } else { startPad(); }
    },
    stop() {
      if (!active) return;
      active = false;
      if (el) {
        let v = el.volume;
        const fade = setInterval(() => {
          v -= 0.02;
          if (v <= 0) { v = 0; clearInterval(fade); el.pause(); }
          el.volume = Math.max(0, v);
        }, 50);
      }
      if (nodes && AC) {
        try {
          nodes.master.gain.linearRampToValueAtTime(0.0001, AC.currentTime + 1.2);
          setTimeout(() => {
            nodes.oscs.forEach(o => { try { o.stop(); } catch (e) {} });
            try { nodes.lfo.stop(); } catch (e) {}
            nodes = null;
          }, 1400);
        } catch (e) { nodes = null; }
      }
    },
    isActive() { return active; }
  };
})();

/* ----------------------------------------------------------------
   5. PARTICLES
   ---------------------------------------------------------------- */
const FX = (() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let particles = [], bursts = [];
  let raf = null;
  const COLORS = ['#ff8fc7','#5ed6c9','#ffd84d','#b28dff','#7cc7ff','#ff6b6b'];
  const SHAPES = ['circle','star','heart'];

  function drawStar(x, y, r, rot, fill) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  }
  function drawHeart(x, y, r, fill) {
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath();
    const s = r / 12;
    ctx.moveTo(0, 4 * s);
    ctx.bezierCurveTo(0, 0, -6 * s, -2 * s, -8 * s, -7 * s);
    ctx.bezierCurveTo(-10 * s, -12 * s, -3 * s, -14 * s, 0, -9 * s);
    ctx.bezierCurveTo(3 * s, -14 * s, 10 * s, -12 * s, 8 * s, -7 * s);
    ctx.bezierCurveTo(6 * s, -2 * s, 0, 0, 0, 4 * s);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(innerWidth * dpr);
    H = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    seed();
  }
  function seed() {
    const count = Math.min(50, Math.max(18, Math.floor(innerWidth / 32)));
    particles = Array.from({ length: count }, () => {
      const r = (Math.random() * 8 + 3) * dpr;
      return {
        x: Math.random() * W, y: Math.random() * H, r,
        vx: (Math.random() - 0.5) * 0.25 * dpr,
        vy: -(Math.random() * 0.35 + 0.15) * dpr,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.02,
        a: Math.random() * 0.45 + 0.3,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        shape: SHAPES[Math.floor(Math.random() * SHAPES.length)]
      };
    });
  }
  function loop() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y < -30) { p.y = H + 30; p.x = Math.random() * W; }
      if (p.x < -30) p.x = W + 30;
      if (p.x > W + 30) p.x = -30;
      ctx.globalAlpha = p.a;
      if (p.shape === 'circle') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
      } else if (p.shape === 'star') {
        drawStar(p.x, p.y, p.r * 1.2, p.rot, p.color);
      } else {
        drawHeart(p.x, p.y, p.r * 1.5, p.color);
      }
    }
    ctx.globalAlpha = 1;
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx; b.y += b.vy;
      b.vy += 0.12 * dpr;
      b.vx *= 0.985; b.vy *= 0.985;
      b.rot += b.vr;
      b.life -= 1;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      const a = Math.max(0, b.life / b.max);
      ctx.globalAlpha = a;
      if (b.shape === 'circle') {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color; ctx.fill();
      } else if (b.shape === 'star') {
        drawStar(b.x, b.y, b.r * 1.3, b.rot, b.color);
      } else {
        drawHeart(b.x, b.y, b.r * 1.6, b.color);
      }
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(loop);
  }
  function burst(x, y, count = 70) {
    const cx = x * dpr, cy = y * dpr;
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (Math.random() * 8 + 3) * dpr;
      bursts.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 3 * dpr,
        r: (Math.random() * 7 + 3) * dpr,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.15,
        life: Math.floor(Math.random() * 60 + 60),
        max: 120,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        shape: SHAPES[Math.floor(Math.random() * SHAPES.length)]
      });
    }
  }
  function rain(count = 80) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        burst(Math.random() * innerWidth, innerHeight * (0.15 + Math.random() * 0.55), 16);
      }, i * 55);
    }
  }
  function init() {
    resize();
    window.addEventListener('resize', resize);
    if (!raf) loop();
  }
  return { init, burst, rain };
})();

/* ----------------------------------------------------------------
   6. UI HELPERS
   ---------------------------------------------------------------- */
const stageEl = document.getElementById('stage');
const hudEl = document.getElementById('hud');
const toastWrap = document.getElementById('toast-wrap');
const flashEl = document.getElementById('flash');

const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function ar(n) { return String(n).padStart(2,'0').split('').map(d => AR_DIGITS[+d] || d).join(''); }
function arNum(n) { return String(n).split('').map(d => AR_DIGITS[+d] ?? d).join(''); }

/* --- FIX: render returns a Promise so callers can await the DOM --- */
function render(html, animate = true) {
  return new Promise(resolve => {
    if (!animate) {
      stageEl.innerHTML = html;
      resolve();
      return;
    }
    stageEl.classList.add('stage-out');
    setTimeout(() => {
      stageEl.innerHTML = html;
      stageEl.classList.remove('stage-out');
      stageEl.classList.add('stage-in');
      setTimeout(() => stageEl.classList.remove('stage-in'), 750);
      window.scrollTo({ top: 0, behavior: 'auto' });
      resolve();
    }, 300);
  });
}

function flash(color = '#ffffff', dur = 900) {
  flashEl.style.background = color;
  flashEl.classList.remove('fire');
  void flashEl.offsetWidth;
  flashEl.classList.add('fire');
  setTimeout(() => flashEl.classList.remove('fire'), dur);
}

function toast(title, sub = '', type = 'bad', ms = 2600) {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<div class="t-title">${title}</div>${sub ? `<div class="t-sub">${sub}</div>` : ''}`;
  toastWrap.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 400);
  }, ms);
}

function showHUD(show) { hudEl.classList.toggle('hidden', !show); }

function updateHUD() {
  const done = state.completed.length;
  const total = MISSIONS.length;
  document.getElementById('hud-status').textContent =
    done >= total ? 'المهمة اكتملت' : `المهمة ${ar(done + 1)} / ${ar(total)}`;

  document.getElementById('hud-pips').innerHTML = MISSIONS.map((m, i) => {
    const isDone = state.completed.includes(i);
    const isActive = !isDone && i === done;
    const cls = isDone ? 'done' : isActive ? 'active' : '';
    const dot = isDone ? '✓' : isActive ? '★' : '·';
    return `<div class="pip ${cls}"><span class="pip-dot">${dot}</span><span class="pip-label">${ar(i + 1)}</span></div>`;
  }).join('');

  document.getElementById('progress-track').style.width = `${(done / total) * 100}%`;

  // score
  document.getElementById('score-correct').textContent = arNum(state.score.correct);
  document.getElementById('score-wrong').textContent   = arNum(state.score.wrong);
}

function pulseScore(which) {
  const el = document.querySelector(`.score-badge.${which}`);
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 500);
}

function addCorrect() {
  state.score.correct++;
  saveState();
  updateHUD();
  pulseScore('correct');
}
function addWrong() {
  state.score.wrong++;
  saveState();
  updateHUD();
  pulseScore('wrong');
}

/* ----------------------------------------------------------------
   8. MISSION ROUTER
   ---------------------------------------------------------------- */
async function goToMission(index) {
  if (index >= MISSIONS.length) { showFinale(); return; }
  state.stage = 'mission';
  saveState();
  showHUD(true);
  updateHUD();
  await renderMission(index);
}

async function renderMission(index) {
  const m = MISSIONS[index];

  const body =
    m.type === 'image'    ? renderImageMission(m) :
    m.type === 'quote'    ? renderQuoteMission(m) :
    m.type === 'location' ? renderLocationMission(m) :
    m.type === 'code'     ? renderCodeMission(m) :
    m.type === 'assemble' ? renderAssembleMission(m) : '';

  await render(`
    <section class="mission" data-index="${index}">
      <div class="m-head">
        <div class="m-code">المهمة ${ar(index + 1)}</div>
        <h1 class="m-title">${m.title}</h1>
        <p class="m-prompt">${m.prompt}</p>
      </div>
      <div class="m-body">${body}</div>
    </section>
  `);

  // الآن الـ DOM جاهز — اربط الأحداث
  bindMission(index, m);
}

function completeMission(index) {
  if (!state.completed.includes(index)) {
    state.completed.push(index);
    state.completed.sort((a, b) => a - b);
    addCorrect();          // عدّاد الصح يزيد مرة واحدة لكل مهمة
  }
}

async function revealMemory(index, m) {
  completeMission(index);
  Sound.unlock();
  flash('rgba(255,216,77,.55)');
  FX.burst(innerWidth / 2, innerHeight * 0.4, 90);

  const frag = m.fragment
    ? `<div class="fragment">
         <span>حرف اتحصّل عليه</span>
         <span class="frag-letter">${m.fragment}</span>
       </div>`
    : '';

  await render(`
    <section class="mission">
      <div class="reveal">
        <div class="reveal-tag">${m.success.title}</div>
        <div class="reveal-sub">${m.success.sub}</div>

        <div class="memory glass">
          <div class="memory-img"><img src="${m.memory.image}" alt="${m.memory.caption || m.memory.title}"></div>
          <div class="memory-body">
            <div class="memory-eyebrow">الذكرى ${ar(index + 1)}</div>
            <h2 class="memory-title">${m.memory.title}</h2>
            <p class="memory-text">${m.memory.text}</p>
            ${m.memory.details ? `<div class="memory-details">
              ${m.memory.details.map(detail => `<div class="memory-detail"><strong>${detail.label}</strong><span>${detail.text}</span></div>`).join('')}
            </div>` : ''}
            <div class="memory-cap">${m.memory.caption}</div>
            ${frag}
          </div>
        </div>

        <div class="reveal-actions">
          <button class="btn primary" id="continue-btn">
            ${index + 1 >= MISSIONS.length ? 'المهمة الأخيرة' : 'كمّل'}
          </button>
        </div>
      </div>
    </section>
  `);

  document.getElementById('continue-btn').addEventListener('click', () => {
    Sound.click();
    goToMission(index + 1);
  });
}

function renderAssembleMission(m) {
  const letters = MISSIONS.slice(0, 4).map(x => x.fragment).filter(Boolean);
  let shuffled = letters.slice();
  const target = letters.join('');
  let guard = 0;
  do {
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    guard++;
  } while (shuffled.join('') === target && guard < 20);

  return `
    <div class="assemble" id="assemble">
      <div class="slots" id="slots">
        ${letters.map((_, i) => `<div class="slot" data-slot="${i}"></div>`).join('')}
      </div>
      <div class="tiles" id="tiles">
        ${shuffled.map((l, i) => `<button class="tile" data-tile="${i}" data-letter="${l}">${l}</button>`).join('')}
      </div>
      <button class="btn ghost" id="clear-btn">امسح</button>
    </div>`;
}

/* ----------------------------------------------------------------
   10. MISSION BINDERS  (called AFTER render)
   ---------------------------------------------------------------- */
function bindMission(index, m) {
  if (m.type === 'image')    return bindImageChoice(index, m);
  if (m.type === 'quote' || m.type === 'location') return bindOptions(index, m);
  if (m.type === 'code')     return bindCode(index, m);
  if (m.type === 'assemble') return bindAssemble(index, m);
}

function bindImageChoice(index, m) {
  let locked = false;
  const cards = Array.from(document.querySelectorAll('.card'));
  cards.forEach(card => {
    card.addEventListener('click', () => {
      if (locked) return;
      const id = card.dataset.id;

      if (id === m.correct) {
        locked = true;
        Sound.correct();
        card.classList.add('correct', 'selected');
        cards.forEach(c => { if (c !== card) c.style.opacity = '.3'; });
        flash('rgba(126,231,135,.4)', 800);
        FX.burst(innerWidth / 2, innerHeight * 0.45, 80);
        setTimeout(() => revealMemory(index, m), 1150);
      } else {
        Sound.wrong();
        addWrong();
        card.classList.remove('wrong');
        void card.offsetWidth;
        card.classList.add('wrong');
        toast('مرفوض', 'الذكرى دي مش بتاعتنا. جرّب تاني.', 'bad');
        setTimeout(() => card.classList.remove('wrong'), 700);
      }
    });
  });
}

function bindOptions(index, m) {
  let locked = false;
  const opts = Array.from(document.querySelectorAll('.option'));
  opts.forEach(opt => {
    opt.addEventListener('click', () => {
      if (locked) return;
      const id = opt.dataset.id;

      if (id === m.correct) {
        locked = true;
        Sound.correct();
        opt.classList.add('correct');
        opts.forEach(o => { if (o !== opt) o.style.opacity = '.3'; });
        flash('rgba(126,231,135,.35)', 800);
        FX.burst(innerWidth / 2, innerHeight * 0.5, 80);
        setTimeout(() => revealMemory(index, m), 1100);
      } else {
        Sound.wrong();
        addWrong();
        opt.classList.remove('wrong');
        void opt.offsetWidth;
        opt.classList.add('wrong');
        toast(
          m.type === 'quote' ? 'تأكيد غلط' : 'المكان غلط',
          m.type === 'quote' ? 'الصوت دا مش صوته. جرّب تاني.' : 'إحنا مكانش في المكان دا. جرّب تاني.',
          'bad'
        );
        setTimeout(() => opt.classList.remove('wrong'), 700);
      }
    });
  });
}

function bindCode(index, m) {
  const wrap = document.getElementById('code-wrap');
  const digits = Array.from(document.querySelectorAll('.digit'));
  const keypad = document.getElementById('keypad');
  let entered = '';
  let locked = false;

  function paint() {
    digits.forEach((d, i) => {
      d.textContent = entered[i] || '';
      d.classList.toggle('filled', Boolean(entered[i]));
    });
  }
  function check() {
    if (entered === m.code) {
      locked = true;
      Sound.correct();
      wrap.classList.add('granted');
      flash('rgba(126,231,135,.45)', 900);
      FX.burst(innerWidth / 2, innerHeight * 0.45, 90);
      setTimeout(() => revealMemory(index, m), 1250);
    } else {
      Sound.wrong();
      addWrong();
      wrap.classList.remove('shake');
      void wrap.offsetWidth;
      wrap.classList.add('shake');
      toast('الكود غلط', 'دا مش التاريخ. جرّب تاني.', 'bad');
      setTimeout(() => {
        entered = '';
        paint();
        wrap.classList.remove('shake');
      }, 620);
    }
  }

  keypad.addEventListener('click', e => {
    const key = e.target.closest('.key');
    if (!key || locked) return;
    const k = key.dataset.k;
    if (!k) return;
    Sound.tick();
    if (k === 'del') { entered = entered.slice(0, -1); paint(); return; }
    if (entered.length >= 4) return;
    entered += k;
    paint();
    if (entered.length === 4) setTimeout(check, 260);
  });

  function onKey(e) {
    if (locked) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (/^[0-9]$/.test(e.key) && entered.length < 4) {
      entered += e.key; paint();
      if (entered.length === 4) setTimeout(check, 260);
    } else if (e.key === 'Backspace') {
      entered = entered.slice(0, -1); paint();
    }
  }
  document.addEventListener('keydown', onKey);
  const observer = new MutationObserver(() => {
    if (!document.getElementById('code-wrap')) {
      document.removeEventListener('keydown', onKey);
      observer.disconnect();
    }
  });
  observer.observe(stageEl, { childList: true });
}

function bindAssemble(index, m) {
  const assemble = document.getElementById('assemble');
  const slots = Array.from(document.querySelectorAll('.slot'));
  const tiles = Array.from(document.querySelectorAll('.tile'));
  const target = MISSIONS.slice(0, 4).map(x => x.fragment).filter(Boolean).join('');
  let placed = [];
  let locked = false;

  function paint() {
    slots.forEach((s, i) => {
      const item = placed[i];
      s.textContent = item ? item.letter : '';
      s.classList.toggle('filled', Boolean(item));
    });
    tiles.forEach(t => t.classList.toggle('used', placed.some(p => p.tileEl === t)));
  }
  function check() {
    if (placed.length !== target.length) return;
    const word = placed.map(p => p.letter).join('');
    if (word === target) {
      locked = true;
      assemble.classList.add('solved');
      Sound.correct();
      flash('rgba(126,231,135,.5)', 1000);
      FX.burst(innerWidth / 2, innerHeight * 0.4, 130);
      setTimeout(() => cinematicFinale(index, m), 1400);
    } else {
      Sound.wrong();
      addWrong();
      assemble.classList.remove('shake');
      void assemble.offsetWidth;
      assemble.classList.add('shake');
      toast('الترتيب غلط', 'لسه مش هي الكلمة. رتّب تاني وجرّب.', 'bad');
      setTimeout(() => {
        placed = [];
        paint();
        assemble.classList.remove('shake');
      }, 700);
    }
  }

  tiles.forEach(tile => {
    tile.addEventListener('click', () => {
      if (locked || placed.length >= target.length) return;
      if (placed.some(p => p.tileEl === tile)) return;
      Sound.tick();
      placed.push({ tileEl: tile, letter: tile.dataset.letter });
      paint();
      if (placed.length === target.length) setTimeout(check, 320);
    });
  });

  slots.forEach((slot, i) => {
    slot.addEventListener('click', () => {
      if (locked || !placed[i]) return;
      Sound.click();
      placed.splice(i, 1);
      paint();
    });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    if (locked) return;
    Sound.click();
    placed = [];
    paint();
  });
}

/* ----------------------------------------------------------------
   11. CINEMATIC FINALE
   ---------------------------------------------------------------- */
function cinematicFinale(index, m) {
  completeMission(index);
  showHUD(false);

  const cine = document.createElement('div');
  cine.className = 'cine';
  cine.innerHTML = `
    <div class="cine-inner">
      <div class="cine-line1">المفتاح اتقبل</div>
      <div class="cine-line2">جاري فتح المكافأة...</div>
      <div class="cine-bar"><span></span></div>
    </div>`;
  document.body.appendChild(cine);

  Sound.reward();
  FX.rain(80);

  setTimeout(() => {
    cine.classList.add('hide');
    setTimeout(() => cine.remove(), 700);
    showFinale();
  }, 3600);
}

/* ----------------------------------------------------------------
   12. FINAL SCREEN
   ---------------------------------------------------------------- */
async function showFinale() {
  state.stage = 'final';
  saveState();
  showHUD(true);
  updateHUD();

  const F = CONFIG.final;

  const galleryHTML = F.photos && F.photos.length
    ? `<div class="gallery reveal-scroll">
        ${F.photos.map(p => `
          <figure>
            <img src="${p.src}" alt="${p.caption || 'صورة من المعرض'}">
            ${p.caption ? `<figcaption>${p.caption}</figcaption>` : ''}
          </figure>
        `).join('')}
      </div>` : '';

  const videoHTML = F.video && F.video.src
    ? `<div class="video-wrap reveal-scroll">
        <video controls playsinline ${F.video.poster ? `poster="${F.video.poster}"` : ''} src="${F.video.src}"></video>
      </div>` : '';

  const scoreSummary = `
    <div class="score-summary">
      <div class="score-row good">
        <span class="sr-icon">✓</span>
        <span>إجابات صح</span>
        <b>${arNum(state.score.correct)}</b>
      </div>
      <div class="score-row bad">
        <span class="sr-icon">✗</span>
        <span>إجابات غلط</span>
        <b>${arNum(state.score.wrong)}</b>
      </div>
    </div>`;

  await render(`
    <section class="finale">
      <h1 class="finale-title">المهمة<br>اكتملت</h1>
      <div class="reward-badge">★ اتفتحت المكافأة ★</div>
      ${scoreSummary}

      <div class="reward">
        <div class="letter glass reveal-scroll">
          <h2><em>${F.title}</em></h2>
          ${F.paragraphs.map(p => `<p>${p}</p>`).join('')}
          <div class="sign">${F.signature}</div>
        </div>

        ${galleryHTML}
        ${videoHTML}

        <div class="surprise reveal-scroll">
          <button class="btn pink xl" id="surprise-btn">${F.surprise.button}</button>
          <div class="surprise-text" id="surprise-text">${F.surprise.text}</div>
        </div>
      </div>
    </section>
  `);

  // scroll reveal — now safe because DOM is actually rendered
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal-scroll').forEach(el => io.observe(el));

  setTimeout(() => {
    Sound.reward();
    flash('rgba(255,255,255,.7)', 1200);
    FX.burst(innerWidth / 2, innerHeight * 0.35, 150);
  }, 400);

  const btn = document.getElementById('surprise-btn');
  btn.addEventListener('click', () => {
    Sound.unlock();
    document.getElementById('surprise-text').classList.add('show');
    btn.style.display = 'none';
    FX.rain(60);
    const rect = btn.getBoundingClientRect();
    FX.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 100);
  });
}

/* ----------------------------------------------------------------
   13. HUD CONTROLS
   ---------------------------------------------------------------- */
document.getElementById('btn-music').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (Music.isActive()) {
    Music.stop();
    state.music = false;
    btn.classList.remove('on');
  } else {
    audioCtx();
    Music.start();
    state.music = true;
    btn.classList.add('on');
  }
  Sound.click();
});

document.getElementById('btn-sound').addEventListener('click', e => {
  state.sound = !state.sound;
  saveState();
  e.currentTarget.classList.toggle('on', state.sound);
  e.currentTarget.textContent = state.sound ? '🔊' : '🔇';
  if (state.sound) Sound.click();
});

document.getElementById('btn-restart').addEventListener('click', () => {
  if (confirm('تبدأ الرحلة من الأول؟ كل التقدم هيتلغي.')) resetQuest();
});

/* ----------------------------------------------------------------
   14. BOOT
   ---------------------------------------------------------------- */
(function boot() {
  FX.init();
  loadState();

  document.getElementById('btn-sound').classList.toggle('on', state.sound);
  document.getElementById('btn-sound').textContent = state.sound ? '🔊' : '🔇';

  if (state.stage === 'final' && state.completed.length >= MISSIONS.length) {
    updateHUD();
    showFinale();
  } else if (state.stage === 'mission' && state.completed.length < MISSIONS.length) {
    goToMission(state.completed.length);
  } else if (state.completed.length >= MISSIONS.length) {
    showFinale();
  } else {
    showIntro();
  }

  document.addEventListener('mouseover', e => {
    if (e.target.closest('.btn, .card, .option, .key, .tile')) Sound.hover();
  });
})();
</script>
